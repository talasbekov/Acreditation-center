log_format accreditation '$time_iso8601 "$request_method" $status $body_bytes_sent $request_time';
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /dev/stdout accreditation;
    error_log /dev/stderr crit;
    root /usr/share/nginx/html;
    client_max_body_size 24m;
    # Редиректы — относительными адресами: nginx слушает 8443 внутри контейнера, а снаружи порт другой.
    absolute_redirect off;

    location = /workspace { return 308 /workspace/; }
    location ^~ /workspace/assets/ { try_files $uri =404; }
    location /workspace/ { try_files $uri /workspace/index.html; }

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;

    # Интерфейс на Next.js (сервис ui, web/). Django-адреса ниже остаются у app.
    location = / { proxy_pass http://ui:3000; }
    location ^~ /_next/ { proxy_pass http://ui:3000; }
    location ~ ^/(login|cabinet|requests|attendees|admin|staff|events|register|change-password)(/|$) {
        proxy_pass http://ui:3000;
    }
    # Старые точки входа (закладки, письма, редирект после установки пароля) ведут в новый интерфейс.
    location ~ ^/((kz|en)/)?(user_login/)?$ { return 302 /login; }
    location ~ ^/((kz|en)/)?application/$ { return 302 /cabinet; }
    location = /avmac/ { return 302 /admin/events; }
    location ^~ /operator-access/ {
        access_log off;
        proxy_pass http://app:8000;
    }
    # Export archives can be gigabytes. Stream them straight through: no nginx temp
    # copy of personal data, no 1 GB buffering cap, and enough time for the app to
    # hash a large package before the first byte and for slow clients to finish.
    location ~ ^/(export_delta|export_package|download_photos)/ {
        proxy_pass http://app:8000;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location / {
        # Media stays behind Django's object permissions, including old QR files.
        proxy_pass http://app:8000;
    }
}

log_format accreditation '$time_iso8601 "$request_method" $status $body_bytes_sent $request_time';
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /dev/stdout accreditation;
    error_log /dev/stderr crit;
    root /usr/share/nginx/html;
    client_max_body_size 24m;

    location = /workspace { return 308 /workspace/; }
    location ^~ /workspace/assets/ { try_files $uri =404; }
    location /workspace/ { try_files $uri /workspace/index.html; }

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    location ^~ /operator-access/ {
        access_log off;
        proxy_pass http://app:8000;
    }
    location / {
        # Media stays behind Django's object permissions, including old QR files.
        proxy_pass http://app:8000;
    }
}

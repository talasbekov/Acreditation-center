{% extends 'gov_base.html' %}
{% load static ui_tags %}
{% block body_block %}

<div class="ds-narrow">
    <div class="ds-header">
        <h1 class="ds-h1">{% t "Изменить пароль" %}</h1>
    </div>
    {% if error_message %}<p class="ds-notice ds-notice-danger" role="alert">{{ error_message }}</p>{% endif %}
    {% if success_message %}<p class="ds-notice ds-notice-success" role="status">{{ success_message }}</p>{% endif %}
    <a href="{{ lp }}/application/" class="ds-btn ds-btn-primary" style="width:100%">{% t "На главную" %}</a>
</div>
{% endblock %}

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Установка пароля</title>
</head>
<body>
  <main>
    <h1>Установка пароля</h1>
    {% if validlink %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить пароль</button>
      </form>
    {% else %}
      <p>Ссылка недействительна или срок её действия истёк. Запросите новое письмо у администратора.</p>
    {% endif %}
    <p><a href="/user_login/">Войти в систему</a></p>
  </main>
</body>
</html>

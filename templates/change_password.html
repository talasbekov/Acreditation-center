{% extends 'gov_base.html' %}
{% load static ui_tags %}
{% block body_block %}

<div class="ds-narrow">
    <div class="ds-header">
        <h1 class="ds-h1">{% t "Изменить пароль" %}</h1>
    </div>
    <form class="ds-panel" method="post" action="{{ lp }}/change_password/">
        {% csrf_token %}
        {% if error_message %}
        <p class="ds-notice ds-notice-danger" role="alert">{{ error_message }}</p>
        {% endif %}
        <div class="ds-field">
            <label for="old_password">{% t "Старый пароль" %}</label>
            <input type="password" id="old_password" name="old_password" class="form-control" autocomplete="off" required>
        </div>
        <div class="ds-field">
            <label for="new_password">{% t "Новый пароль" %}</label>
            <input type="password" id="new_password" name="new_password" class="form-control" autocomplete="off" required>
        </div>
        <div class="ds-field">
            <label for="new_password_repeat">{% t "Повторите пароль" %}</label>
            <input type="password" id="new_password_repeat" name="new_password_repeat" class="form-control" autocomplete="off" required>
        </div>
        <button type="submit" class="ds-btn ds-btn-primary" style="width:100%">{% t "Изменить пароль" %}</button>
    </form>
</div>
{% endblock %}

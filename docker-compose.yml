services:
  db:
    image: postgres:15-alpine
    container_name: accr-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=eventdb
      - POSTGRES_USER=event
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event -d eventdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  accreditation-center:
    build: .
    image: accr-django:latest
    container_name: accr-django
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./media:/app/media
      - ./static:/app/static
      # staticfiles — named volume (app-owned, инициализируется из образа), а НЕ
      # host bind-mount: иначе Docker создаёт ./staticfiles как root и collectstatic
      # (контейнер бежит под app) падает с PermissionError → крашлуп.
      - staticfiles_data:/app/staticfiles
      - ./logs:/app/logs
      - tmp_archives:/tmp
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=eventproject.settings
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=eventdb
      - DB_USER=event
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
    command: >
      bash -c "
      echo 'Waiting for database...' &&
      until pg_isready -h db -U event; do
        sleep 1
      done &&
      echo 'Database is ready. Starting application...' &&
      python manage.py migrate --noinput &&
      python manage.py createcachetable &&
      python manage.py collectstatic --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  tmp_archives:
  staticfiles_data:

networks:
  default:
    driver: bridge
